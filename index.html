<style>
  :root{
    --bg:#1A0B2E;
    --surface:#2B1152;
    --surface2:#3B1876;
    --gold:#FFC93C;
    --gold-dim:#F2A900;
    --coral:#FF3D71;
    --ivory:#FFF7F0;
    --muted:#C3A9E8;
    --good:#2EF2A6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ivory);
    font-family:'Work Sans',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,201,60,0.10), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(255,61,113,0.10), transparent 45%);
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:20px 18px 40px;
    display:flex;
    flex-direction:column;
  }
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:700;margin:0 0 4px;}
  .brand{
    text-align:center;
    margin-bottom:22px;
  }
  .brand .mark{
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--gold);
    font-family:'Space Mono',monospace;
  }
  .brand h1{font-size:30px;color:var(--ivory);}
  .card{
    background:var(--surface);
    border-radius:16px;
    padding:20px;
    margin-bottom:14px;
    border:1px solid rgba(255,255,255,0.06);
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  .muted{color:var(--muted);font-size:14px;}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;letter-spacing:.3px;}
  input[type=text], textarea{
    width:100%;
    background:var(--surface2);
    border:1px solid rgba(255,255,255,0.1);
    color:var(--ivory);
    padding:12px 14px;
    border-radius:10px;
    font-size:16px;
    font-family:'Work Sans',sans-serif;
    margin-bottom:14px;
  }
  textarea{min-height:90px;resize:vertical;}
  .word-box-input{margin-bottom:8px;padding:10px 14px;}
  #wordBoxesContainer{margin-bottom:6px;}
  input:focus, textarea:focus, button:focus{outline:2px solid var(--gold);outline-offset:2px;}
  button{
    width:100%;
    padding:14px 16px;
    border-radius:10px;
    border:none;
    font-size:16px;
    font-weight:600;
    font-family:'Work Sans',sans-serif;
    cursor:pointer;
    margin-bottom:10px;
    transition:transform .08s ease;
  }
  button:active{transform:scale(0.98);}
  .btn-primary{background:var(--gold);color:#20231A;}
  .btn-secondary{background:var(--surface2);color:var(--ivory);border:1px solid rgba(255,255,255,0.15);}
  .btn-coral{background:var(--coral);color:#2A1310;}
  .btn-small{width:auto;padding:8px 14px;font-size:13px;margin:0;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  .keytag{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(160deg,#FFC93C,#F2A900);
    color:#2A2010;
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:22px;
    letter-spacing:4px;
    padding:10px 18px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .keytag::before{content:'🔑';font-size:16px;}
  .center{text-align:center;}
  .players-list{list-style:none;padding:0;margin:0;}
  .players-list li{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 12px;background:var(--surface2);border-radius:8px;margin-bottom:8px;
  }
  .players-list .score{font-family:'Space Mono',monospace;color:var(--gold);font-weight:700;}
  .host-badge{font-size:10px;background:var(--gold);color:#20231A;padding:2px 6px;border-radius:5px;margin-left:6px;letter-spacing:.5px;}
  .timer-ring{
    display:flex;flex-direction:column;align-items:center;justify-content:center;margin:6px auto 16px;
  }
  .timer-num{font-family:'Space Mono',monospace;font-size:32px;font-weight:700;color:var(--gold);margin-top:-72px;}
  .prompt-box{
    background:var(--surface2);
    border-left:4px solid var(--gold);
    padding:16px;
    border-radius:8px;
    font-family:'Fraunces',serif;
    font-size:19px;
    line-height:1.4;
    margin-bottom:16px;
  }
  .blank{color:var(--coral);font-weight:700;}
  .grid-boggle{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    max-width:280px;
    margin:0 auto 18px;
  }
  .grid-boggle .cell{
    aspect-ratio:1;
    background:var(--surface2);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;
    font-size:24px;font-weight:700;
    color:var(--ivory);
  }
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .menu-grid button{margin-bottom:0;font-size:14px;padding:16px 10px;}
  .playing-card{
    display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
    width:52px;height:74px;border-radius:8px;background:var(--ivory);color:#1A0B2E;
    font-family:'Space Mono',monospace;font-weight:700;font-size:18px;
    box-shadow:0 3px 8px rgba(0,0,0,0.35);margin:3px;
  }
  .playing-card.red{color:var(--coral);}
  .playing-card.hidden{background:linear-gradient(160deg,#3B1876,#2B1152);color:transparent;border:2px solid var(--gold);}
  .card-row{display:flex;flex-wrap:wrap;justify-content:center;margin-bottom:10px;}
  .hand-value{font-family:'Space Mono',monospace;color:var(--gold);font-weight:700;font-size:15px;text-align:center;margin-bottom:12px;}
  .tag{
    display:inline-block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--gold);font-family:'Space Mono',monospace;margin-bottom:8px;
  }
  .submission-item{
    background:var(--surface2);padding:12px 14px;border-radius:8px;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;
    border:2px solid transparent;
  }
  .submission-item.selected{border-color:var(--gold);}
  .submission-item.correct{border-color:var(--good);background:rgba(127,184,138,0.15);}
  .submission-item.wrong{opacity:0.6;}
  .divider{height:1px;background:rgba(255,255,255,0.08);margin:16px 0;}
  .clue-log{list-style:none;padding:0;margin:0 0 14px;}
  .clue-log li{
    font-family:'Fraunces',serif;font-size:18px;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,0.1);
  }
  .clue-log li .idx{color:var(--gold);font-family:'Space Mono',monospace;font-size:13px;margin-right:8px;}
  .error-text{color:var(--coral);font-size:13px;margin:-8px 0 12px;}
  .footer-note{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;}
  .scoreboard-podium{text-align:center;margin-bottom:6px;}
  .scoreboard-podium .place1{font-size:22px;color:var(--gold);font-family:'Fraunces',serif;font-weight:700;}
  a{color:var(--gold);}
</style>

    const j = Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]] = [deck[j],deck[i]];
  }
  return deck;
}
function cardRank(card){ return card.slice(0,-1); }
function blackjackCardValue(card){
  const r = cardRank(card);
  if(r==='A') return 11;
  if(r==='J'||r==='Q'||r==='K') return 10;
  return parseInt(r,10);
}
function blackjackHandValue(hand){
  let sum = hand.reduce((a,c)=>a+blackjackCardValue(c),0);
  let aces = hand.filter(c=>cardRank(c)==='A').length;
  while(sum>21 && aces>0){ sum -= 10; aces--; }
  return sum;
}
function warCardStrength(card){

}

function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+' timed out after '+(ms/1000)+'s — check your Realtime Database rules allow access.')), ms))
  ]);
}
async function sGet(key){
  try{
    const snap = await withTimeout(get(ref(db,key)), 8000, 'Read');
    return snap.exists() ? snap.val() : null;
  } catch(e){ console.error('rtdb get failed', e); showDebug('Read failed: '+e.message); return null; }
}
async function sSet(key, val){
  try{
    await withTimeout(set(ref(db,key), val), 8000, 'Write');
    return true;
  } catch(e){ console.error('rtdb set failed', e); showDebug('Write failed: '+e.message); return false; }
}
async function sDelete(key){

    await withTimeout(set(ref(db,key), null), 8000, 'Delete');
    return true;
  } catch(e){ console.error('rtdb delete failed', e); showDebug('Delete failed: '+e.message); return false; }
}
async function sList(prefix){
  try{
    const q = query(ref(db), orderByKey(), startAt(prefix), endAt(prefix+'\uf8ff'));
    const snap = await withTimeout(get(q), 8000, 'List');
    if(!snap.exists()) return [];
    const keys=[];
    snap.forEach(child=>{ keys.push(child.key); });
    return keys;
  } catch(e){ console.error('rtdb list failed', e); showDebug('List failed: '+e.message); return []; }
}

function norm(s){ return (s||'').toString().trim().toLowerCase().replace(/[^a-z0-9]/g,''); }
function stemWord(raw){
  let w = norm(raw);
  if(w.length<=3) return w;
  const dedupeTail = (s)=> (s.length>=2 && s[s.length-1]===s[s.length-2]) ? s.slice(0,-1) : s;
  if(w.endsWith('ies') && w.length>4) return w.slice(0,-3)+'y';
  if(w.endsWith('ing') && w.length>5) return dedupeTail(w.slice(0,-3));
  if(w.endsWith('ed') && w.length>4) return dedupeTail(w.slice(0,-2));
  if(w.endsWith('es') && w.length>4) return w.slice(0,-2);
  if(w.endsWith('est') && w.length>5) return w.slice(0,-3);
  if(w.endsWith('ly') && w.length>4) return w.slice(0,-2);
  if(w.endsWith('er') && w.length>4) return w.slice(0,-2);
  if(w.endsWith('s') && !w.endsWith('ss') && w.length>3) return w.slice(0,-1);
  return w;
}
function levDist(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  }
  return dp[m][n];
}
function matchesAnswer(guess, answers){
  const g=norm(guess);
  if(!g) return false;
  for(const a of answers){
    const na=norm(a);
    if(g===na) return true;
    if(na.length>4 && levDist(g,na)<=1) return true;
  }
  return false;
}

/* ============ BOGGLE GRID ============ */
function makeBoggleGrid(){
  const letters=[];
  for(let i=0;i<16;i++) letters.push(LETTER_POOL[Math.floor(Math.random()*LETTER_POOL.length)]);
  return letters; // 16-length array, row-major 4x4
}
function boggleNeighbors(idx){
  const r=Math.floor(idx/4), c=idx%4, out=[];
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(dr===0&&dc===0)continue;
    const nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<4&&nc>=0&&nc<4) out.push(nr*4+nc);
  }
  return out;
}
function boggleWordValid(word, grid){
  word=word.toUpperCase().replace(/[^A-Z]/g,'');
  if(word.length<3) return false;
  function dfs(pos, used, wi){
    if(wi===word.length) return true;
    for(const n of boggleNeighbors(pos)){
      if(used.has(n)) continue;
      if(grid[n]===word[wi]){
        used.add(n);
        if(dfs(n,used,wi+1)) return true;
        used.delete(n);
      }
    }
    return false;
  }
  for(let i=0;i<16;i++){
    if(grid[i]===word[0]){
      const used=new Set([i]);
      if(word.length===1) return true;
      if(dfs(i,used,1)) return true;
    }
  }
  return false;
}
function boggleScore(len){
  if(len<3) return 0;
  if(len<=4) return 1;
  if(len===5) return 2;
  if(len===6) return 3;
  return 5;
}
function wordbankScore(len){
  if(len<3) return 0;
  if(len===3) return 1;
  if(len===4) return 2;
  if(len===5) return 3;
  return 5;
}
function wordUsesLetters(word, baseCounts){
  const counts={};
  for(const ch of word) counts[ch]=(counts[ch]||0)+1;
  for(const ch in counts){
    if(!baseCounts[ch] || counts[ch]>baseCounts[ch]) return false;
  }
  return true;
}

/* ============ SPELLING / DICTIONARY CHECK ============ */
const DICT_CACHE = new Map();
async function isRealWord(word){
  word = word.toLowerCase();
  if(DICT_CACHE.has(word)) return DICT_CACHE.get(word);
  try{
    const res = await withTimeout(
      fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`),
      5000, 'Dictionary check'
    );
    const ok = res.ok;
    DICT_CACHE.set(word, ok);
    return ok;
  }catch(e){
    // dictionary unreachable — don't unfairly zero the player out, accept the word
    return true;
  }
}
async function filterRealWords(words){
  const results = await Promise.all(words.map(async w => [w, await isRealWord(w)]));
  return new Set(results.filter(([,ok])=>ok).map(([w])=>w));
}

  ensureArrays(st);
  IS_HOST = (st.hostName === ME);
  if(IS_HOST){

  }
  if(ME && !st.players.includes(ME)){
    // we've been removed from the game (or the game reset without us) — boot back to join screen
    if(POLL) clearInterval(POLL);
    const wasCode = CODE;

    const b = document.getElementById('leaveGameBtn');
    if(b) b.remove();
    renderJoinScreen();
    showErr("You've been removed from this game by the host.");
    return;
  }
  const snapshot = JSON.stringify(st);
  if(snapshot === lastStateSnapshot){
    return; // nothing actually changed — don't touch the DOM or steal input focus
  }
  lastStateSnapshot = snapshot;
  render(st);
}

  st.usedBluff = st.usedBluff || [];

  st.usedWYR = st.usedWYR || [];
  st.history = st.history || [];
  st.players = st.players || [];
  st.totalScores = st.totalScores || {};

}

async function hostMaintain(st){
  ensureArrays(st);
  // merge new joiners
  const joinKeys = await sList(`vault:${st.code}:join:`);
  let changed=false;
  for(const k of joinKeys){
    const name = k.split(':').slice(3).join(':');
    if(name && !st.players.includes(name)){
      st.players.push(name);
      st.totalScores[name]=0;
      changed=true;
    }
  }
  // if clue round in guessing phase, check for a correct guess
  if(st.round && st.round.type==='clue' && st.round.phase==='guessing'){
    const gKeys = await sList(`vault:${st.code}:guess:${st.roundNum}:`);
    let best=null;
    for(const k of gKeys){
      const name = k.split(':').slice(4).join(':');
      if(name===st.round.clueGiver) continue;
      const g = await sGet(k);
      if(g && matchesAnswer(g.text, [st.round.secretWord])){
        if(!best || g.ts<best.ts) best={name,ts:g.ts};
      }
    }
    if(best){
      const clueCount = (st.round.clues||[]).length;
      const pts = Math.max(1, 6-clueCount);
      st.totalScores[best.name]=(st.totalScores[best.name]||0)+pts;
      st.totalScores[st.round.clueGiver]=(st.totalScores[st.round.clueGiver]||0)+pts;
      st.round.phase='reveal';
      st.round.winner=best.name;
      st.round.pointsAwarded=pts;
      changed=true;
    }
  }
  // if a war round is mid-play, check whether the current flip is ready to resolve
  if(st.round && st.round.type==='war' && st.round.phase==='submit'){
    const resolved = await warResolveFlipIfReady(st, false);
    if(resolved) changed = true;
  }
  if(changed){ st.updatedAt=Date.now(); await sSet(stateKey(st.code), st); }
}

function startPolling(){
  if(POLL) clearInterval(POLL);
  refreshAndRender();
  POLL = setInterval(refreshAndRender, 2200);
}

/* ============ ROUND SETUP GENERATORS (host only) ============ */
function pickUnused(bank, usedArr){
  const avail = bank.map((_,i)=>i).filter(i=>!usedArr.includes(i));
  const pool = avail.length? avail : bank.map((_,i)=>i);
  if(!avail.length) usedArr.length=0;
  const idx = pool[Math.floor(Math.random()*pool.length)];
  usedArr.push(idx);
  return idx;
}

async function hostStartRound(type){
 try{
  const st = await sGet(stateKey(CODE));
  if(!st){ showDebug('Could not load game state (connection or rules issue) — try again.'); return; }
  ensureArrays(st);
  st.roundNum = (st.roundNum||0)+1;
  const rn = st.roundNum;
  let round = {type, phase:'submit', startedAt:Date.now(), durationMs:60000};
  if(type==='trivia'){
    const idx=pickUnused(TRIVIA, st.usedTrivia);
    round.question=TRIVIA[idx].q; round.answers=TRIVIA[idx].a;
    round.durationMs=25000;
  } else if(type==='bluff'){
    const idx=pickUnused(BLUFF, st.usedBluff);
    round.fact=BLUFF[idx].fact; round.answer=BLUFF[idx].answer;
    round.phase='submit'; round.durationMs=40000;
  } else if(type==='prefix'){
    const idx=pickUnused(PREFIXES, st.usedPrefix);
    round.prefix=PREFIXES[idx];
    round.durationMs=50000;
  } else if(type==='boggle'){
    round.grid = makeBoggleGrid();
    round.durationMs=75000;
  } else if(type==='wordbank'){
    const idx=pickUnused(WORDBANK_WORDS, st.usedWordbank);
    round.baseWord=WORDBANK_WORDS[idx];
    round.durationMs=60000;
  } else if(type==='clue'){
    if(!st.players || st.players.length===0){
      showDebug('No players found in the game — cannot start Clue Chain.');
      return;
    }
    const idx=pickUnused(CLUE_WORDS, st.usedClue);
    const giver = st.players[(st.roundNum-1)%st.players.length];
    round.secretWord = CLUE_WORDS[idx];
    round.clueGiver = giver;
    round.clues=[];
    round.phase='clueing';
  } else if(type==='blackjack'){
    const dealerDeck = makeShuffledDeck();
    round.dealerHand = [dealerDeck.pop(), dealerDeck.pop()];
    round.dealerDeck = dealerDeck;
    round.durationMs = 90000;
  } else if(type==='war'){
    round.flip = 1;
    round.totalFlips = WAR_FLIPS_PER_GAME;
    round.flipWins = {};
    (st.players||[]).forEach(p=> round.flipWins[p]=0);
    round.durationMs = 90000;
  } else if(type==='emoji'){
    const idx=pickUnused(EMOJI, st.usedEmoji);
    round.question=EMOJI[idx].q; round.answers=EMOJI[idx].a;
    round.durationMs=25000;
  } else if(type==='hilo'){
    round.durationMs = 60000;
  } else if(type==='wyr'){
    const idx=pickUnused(WOULD_YOU_RATHER, st.usedWYR);
    round.optionA = WOULD_YOU_RATHER[idx].a;
    round.optionB = WOULD_YOU_RATHER[idx].b;
    round.phase = 'vote';
    round.durationMs = 30000;
  }
  st.phase='round';
  st.round=round;
  st.updatedAt=Date.now();
  const ok = await sSet(stateKey(CODE), st);
  if(!ok){ showDebug('Could not save the new round — check Realtime Database write permissions.'); return; }
  localSubmitted=false; selectedVoteChoice=null; clueDraft=""; guessDraft="";
  render(st);
 } catch(e){
   showDebug('hostStartRound error ('+type+'): '+(e && e.message ? e.message : e));
 }
}

async function hostTallyAndReveal(){
  const st = await sGet(stateKey(CODE));
  if(!st){ showDebug('Could not load game state (connection or rules issue) — try again.'); return; }
  ensureArrays(st);
  const rn = st.roundNum, round = st.round;
  if(round.type==='trivia' || round.type==='emoji'){
    const subKeys = await sList(`vault:${CODE}:submit:${rn}:`);
    let results=[];
    for(const k of subKeys){
      const name=k.split(':').slice(4).join(':');
      const s=await sGet(k);
      if(s) results.push({name, text:s.text, ts:s.ts, correct: matchesAnswer(s.text, round.answers)});
    }
    results.sort((a,b)=>a.ts-b.ts);
    let rank=0;
    for(const r of results){
      if(r.correct){
        rank++;
        const pts = rank===1?3:(rank===2?2:1);
        st.totalScores[r.name]=(st.totalScores[r.name]||0)+pts;
        r.points=pts;
      } else r.points=0;
    }
    round.results=results;
  } else if(round.type==='bluff'){
    const subKeys = await sList(`vault:${CODE}:submit:${rn}:`);
    const voteKeys = await sList(`vault:${CODE}:vote:${rn}:`);
    let subs={};
    for(const k of subKeys){
      const name=k.split(':').slice(4).join(':');
      const s=await sGet(k);
      if(s) subs[name]=s.text;
    }
    let votes={};
    for(const k of voteKeys){
      const name=k.split(':').slice(4).join(':');
      const v=await sGet(k);
      if(v) votes[name]=v.choice;
    }
    for(const voter in votes){
      const choice = votes[voter];
      if(choice==='REAL'){
        st.totalScores[voter]=(st.totalScores[voter]||0)+2;
      } else if(subs[choice]!==undefined){
        st.totalScores[choice]=(st.totalScores[choice]||0)+1;
      }
    }
    round.subs=subs; round.votes=votes;
  } else if(round.type==='prefix'){
    const subKeys = await sList(`vault:${CODE}:submit:${rn}:`);
    let perPlayer={};
    for(const k of subKeys){
      const name=k.split(':').slice(4).join(':');
      const s=await sGet(k);
      if(!s) continue;
      const words = (s.text||'').split(/[\n,]+/).map(norm).filter(w=>w && w.startsWith(norm(round.prefix)) && w.length>norm(round.prefix).length);
      const uniq=[...new Set(words)];
      perPlayer[name]=uniq;
    }
    const allCandidates = [...new Set(Object.values(perPlayer).flat())];
    const realWords = await filterRealWords(allCandidates);
    for(const name in perPlayer){
      perPlayer[name] = perPlayer[name].filter(w=>realWords.has(w));
    }
    // collapse word variants (play/plays/playing) to the same stem, per player first
    for(const name in perPlayer){
      const seenStems = new Set();
      perPlayer[name] = perPlayer[name].filter(w=>{
        const stem = stemWord(w);
        if(seenStems.has(stem)) return false;
        seenStems.add(stem);
        return true;
      });
    }
    const stemFreq = {};
    Object.values(perPlayer).flat().forEach(w=>{ const st2=stemWord(w); stemFreq[st2]=(stemFreq[st2]||0)+1; });
    const freq = {};
    Object.values(perPlayer).flat().forEach(w=> freq[w]=stemFreq[stemWord(w)]);
    for(const name in perPlayer){
      let pts=0;
      perPlayer[name].forEach(w=> pts += freq[w]===1?2:0);
      st.totalScores[name]=(st.totalScores[name]||0)+pts;
    }
    round.perPlayer=perPlayer;
    round.wordFreq=freq;
  } else if(round.type==='boggle'){
    const subKeys = await sList(`vault:${CODE}:submit:${rn}:`);
    let perPlayer={};
    for(const k of subKeys){
      const name=k.split(':').slice(4).join(':');
      const s=await sGet(k);
      if(!s) continue;
      const words=(s.text||'').split(/[\n,]+/).map(w=>norm(w)).filter(w=>w.length>=3);
      const uniq=[...new Set(words)];
      const valid = uniq.filter(w=>boggleWordValid(w, round.grid));
      perPlayer[name]=valid;
    }
    const allCandidates = [...new Set(Object.values(perPlayer).flat())];
    const realWords = await filterRealWords(allCandidates);
    for(const name in perPlayer){
      perPlayer[name] = perPlayer[name].filter(w=>realWords.has(w));
    }
    for(const name in perPlayer){
      const seenStems = new Set();
      perPlayer[name] = perPlayer[name].filter(w=>{
        const stem = stemWord(w);
        if(seenStems.has(stem)) return false;
        seenStems.add(stem);
        return true;
      });
    }
    const stemFreq = {};
    Object.values(perPlayer).flat().forEach(w=>{ const st2=stemWord(w); stemFreq[st2]=(stemFreq[st2]||0)+1; });
    const validByWord = {};
    Object.values(perPlayer).flat().forEach(w=> validByWord[w]=stemFreq[stemWord(w)]);
    for(const name in perPlayer){
      let pts=0;
      perPlayer[name].forEach(w=>{
        if(validByWord[w]===1) pts+=boggleScore(w.length);
      });
      st.totalScores[name]=(st.totalScores[name]||0)+pts;
    }
    round.perPlayer=perPlayer;
    round.wordFreq=validByWord;
  } else if(round.type==='wordbank'){
    const base = round.baseWord.toLowerCase();
    const baseCounts={};
    for(const ch of base) baseCounts[ch]=(baseCounts[ch]||0)+1;
    const subKeys = await sList(`vault:${CODE}:submit:${rn}:`);
    let perPlayer={};
    for(const k of subKeys){
      const name=k.split(':').slice(4).join(':');
      const s=await sGet(k);
      if(!s) continue;
      const words=(s.text||'').split(/[\n,]+/).map(w=>norm(w)).filter(w=>w.length>=3 && wordUsesLetters(w, baseCounts));
      const uniq=[...new Set(words)];
      perPlayer[name]=uniq;
    }
    const allCandidates = [...new Set(Object.values(perPlayer).flat())];
    const realWords = await filterRealWords(allCandidates);
    for(const name in perPlayer){
      perPlayer[name] = perPlayer[name].filter(w=>realWords.has(w));
    }
    for(const name in perPlayer){
      const seenStems = new Set();
      perPlayer[name] = perPlayer[name].filter(w=>{
        const stem = stemWord(w);
        if(seenStems.has(stem)) return false;
        seenStems.add(stem);
        return true;
      });
    }
    const stemFreq = {};
    Object.values(perPlayer).flat().forEach(w=>{ const st2=stemWord(w); stemFreq[st2]=(stemFreq[st2]||0)+1; });
    const freq = {};
    Object.values(perPlayer).flat().forEach(w=> freq[w]=stemFreq[stemWord(w)]);
    for(const name in perPlayer){
      let pts=0;
      perPlayer[name].forEach(w=>{
        if(freq[w]===1) pts+=wordbankScore(w.length);
      });
      st.totalScores[name]=(st.totalScores[name]||0)+pts;
    }
    round.perPlayer=perPlayer;
    round.wordFreq=freq;
  } else if(round.type==='blackjack'){
    let dealerHand = [...round.dealerHand];
    let dealerDeck = [...round.dealerDeck];
    while(blackjackHandValue(dealerHand)<17){
      if(dealerDeck.length===0) break;
      dealerHand.push(dealerDeck.pop());
    }
    const dealerVal = blackjackHandValue(dealerHand);
    const dealerBJ = dealerHand.length===2 && dealerVal===21;
    const dealerBust = dealerVal>21;
    const subKeys = await sList(`vault:${CODE}:submit:${rn}:`);
    let results = {};
    for(const k of subKeys){
      const name=k.split(':').slice(4).join(':');
      const s=await sGet(k);
      if(!s || !s.hand) continue;
      const val = blackjackHandValue(s.hand);
      const bust = val>21;
      const naturalBJ = s.hand.length===2 && val===21;
      let outcome, pts;
      if(bust){ outcome='bust'; pts=0; }
      else if(naturalBJ && !dealerBJ){ outcome='blackjack'; pts=3; }
      else if(dealerBust){ outcome='win'; pts=2; }
      else if(val>dealerVal){ outcome='win'; pts=2; }
      else if(val===dealerVal){ outcome='push'; pts=1; }
      else { outcome='lose'; pts=0; }
      results[name] = {hand:s.hand, value:val, outcome, points:pts};
      st.totalScores[name] = (st.totalScores[name]||0)+pts;
    }
    round.dealerFinalHand = dealerHand;
    round.dealerFinalValue = dealerVal;
    round.results = results;
  } else if(round.type==='hilo'){
    const subKeys = await sList(`vault:${CODE}:submit:${rn}:`);
    let results = {};
    for(const k of subKeys){
      const name=k.split(':').slice(4).join(':');
      const s=await sGet(k);
      if(!s) continue;
      const outcome = s.outcome==='busted' ? 'busted' : 'cashedOut';
      const pts = outcome==='busted' ? 0 : s.streak;
      results[name] = {streak: s.streak, outcome, points: pts};
      st.totalScores[name] = (st.totalScores[name]||0)+pts;
    }
    round.results = results;
  } else if(round.type==='wyr'){
    const voteKeys = await sList(`vault:${CODE}:vote:${rn}:`);
    let votes = {};
    for(const k of voteKeys){
      const name=k.split(':').slice(4).join(':');
      const v=await sGet(k);
      if(v) votes[name]=v.choice;
    }
    const countA = Object.values(votes).filter(c=>c==='A').length;
    const countB = Object.values(votes).filter(c=>c==='B').length;
    const majority = countA>countB ? 'A' : (countB>countA ? 'B' : null);
    let results = {};
    for(const name in votes){
      const choice = votes[name];
      const minorityCount = choice==='A' ? countA : countB;
      const isBlackSheep = majority && choice!==majority && minorityCount===1;
      let pts;
      if(!majority) pts = 1; // tie, everyone gets a consolation point
      else if(choice===majority) pts = 2;
      else if(isBlackSheep) pts = 2;
      else pts = 0;
      results[name] = {choice, points: pts, blackSheep: !!isBlackSheep};
      st.totalScores[name] = (st.totalScores[name]||0)+pts;
    }
    round.voteBreakdown = {A:countA, B:countB};
    round.results = results;
  }
  round.phase='reveal';
  st.round=round;
  st.updatedAt=Date.now();
  await sSet(stateKey(CODE), st);
  render(st);
}

/* ============ JOIN / CREATE ============ */
async function storageWorks(){
  const testKey = 'vault:_diag:'+Math.random().toString(36).slice(2);
  const ok = await sSet(testKey, {t:Date.now()});
  if(!ok) return false;
  const back = await sGet(testKey);
  return !!back;
}

async function createGame(name){
  const btn = document.getElementById('createBtn');
  if(btn){ btn.textContent='Starting…'; btn.disabled=true; }
  try{
    const works = await storageWorks();
    if(!works){
      showErr("Couldn't connect to the game database. Check your internet connection and your Realtime Database rules.");
      return;
    }
    ME = name.trim();
    let code = randCode(), tries=0;
    while(tries<8){
      const exists = await sGet(stateKey(code));
      if(!exists) break;
      code = randCode(); tries++;
    }
    CODE = code;
    const st = freshState(CODE, ME);
    const ok1 = await sSet(stateKey(CODE), st);
    const ok2 = await sSet(joinKey(CODE, ME), {name:ME, joinedAt:Date.now()});
    if(!ok1 || !ok2){
      showErr("Created the game but couldn't save it — check your Realtime Database rules allow write access.");
      return;
    }
    IS_HOST = true;
    render(st); // paint immediately using local data, don't wait on a re-fetch
    startPolling();
  } catch(e){
    showDebug('createGame error: '+(e && e.message ? e.message : e));
    showErr("Something went wrong starting the game. See the debug note below.");
  } finally {
    if(btn){ btn.textContent='Start a New Game'; btn.disabled=false; }
  }
}

async function joinGame(name, code){
  const btn = document.getElementById('joinBtn');
  if(btn){ btn.textContent='Joining…'; btn.disabled=true; }
  try{
    const works = await storageWorks();
    if(!works){
      showErr("Couldn't connect to the game database. Check your internet connection and try again.");
      return;
    }
    ME = name.trim();
    CODE = code.trim().toUpperCase();
    const st = await sGet(stateKey(CODE));
    if(!st){
      showErr("Couldn't find that game code. Double check it with your host.");
      ME=null; CODE=null;
      return;
    }
    ensureArrays(st);
    if(st.players.some(p=>p.toLowerCase()===ME.toLowerCase())){
      const reconnecting = confirm(`"${ME}" is already in this game. Is this you reconnecting? Your existing score will carry over.\n\nTap OK if this is you, or Cancel to pick a different name.`);
      if(!reconnecting){
        showErr(`Pick a different name, or ask your host to Remove the old "${ME}" first.`);
        ME=null; CODE=null;
        return;
      }
      // match the exact existing casing so we don't create a duplicate entry
      ME = st.players.find(p=>p.toLowerCase()===ME.toLowerCase());
    }
    const ok = await sSet(joinKey(CODE, ME), {name:ME, joinedAt:Date.now()});
    if(!ok){
      showErr("Found the game but couldn't join it — check your Realtime Database write permissions.");
      return;
    }
    IS_HOST = (st.hostName === ME);
    render(st);
    startPolling();
  } catch(e){
    showDebug('joinGame error: '+(e && e.message ? e.message : e));
    showErr("Something went wrong joining the game. See the debug note below.");
  } finally {
    if(btn){ btn.textContent='Join Game'; btn.disabled=false; }
  }
}

function render(st){
  lastState = st;
  lastStateSnapshot = JSON.stringify(st);
  currentRoundNum = st.roundNum;
  if(st.roundNum !== lastSeenRoundNum){
    lastSeenRoundNum = st.roundNum;
    localSubmitted = false;
    selectedVoteChoice = null;
    clueDraft = "";
    guessDraft = "";
  }
  if(st.phase==='lobby') renderLobby(st);
  else if(st.phase==='round') renderRound(st);
  else if(st.phase==='scoreboard') renderScoreboard(st);
  ensureLeaveButton();
}

function ensureLeaveButton(){
  let b = document.getElementById('leaveGameBtn');
  if(!b){
    b = document.createElement('button');
    b.id='leaveGameBtn';
    b.textContent='Leave Game';
    b.style.cssText='position:fixed;top:14px;right:14px;width:auto;padding:8px 14px;font-size:12px;margin:0;background:rgba(0,0,0,0.35);color:var(--muted);border:1px solid rgba(255,255,255,0.15);border-radius:8px;z-index:500;';
    b.onclick = leaveGame;
    document.body.appendChild(b);
  }

async function leaveGame(){
  try{
    if(IS_HOST && CODE && lastState){
      const st = await sGet(stateKey(CODE));
      if(st){
        ensureArrays(st);
        const remaining = st.players.filter(p=>p!==ME);
        if(remaining.length>0){
          st.hostName = remaining[0];
          await sSet(stateKey(CODE), st);
        }
      }
    }
    if(CODE && ME) await sDelete(joinKey(CODE, ME));
  } catch(e){
    console.error('leaveGame cleanup error', e);
  }
  if(POLL) clearInterval(POLL);
  CODE=null; ME=null; IS_HOST=false; lastState=null;
  localSubmitted=false; selectedVoteChoice=null; clueDraft=""; guessDraft="";
  const b = document.getElementById('leaveGameBtn');
  if(b) b.remove();
  renderJoinScreen();
}

      </div>
    </div>
    ` : `<div class="card center muted">Waiting for ${leader}${anyScores ? " (current leader)" : ""} to pick the next round…</div>`}
    ${isHost ? `
    <div class="card">
      <div class="tag">Host controls</div>
      <button class="btn-coral" id="endBtn">End Game &amp; Show Final Scores</button>
    </div>
    ` : ''}
  `;
  if(isLeader){
    root.querySelectorAll('[data-type]').forEach(b=>{
      b.onclick = ()=> hostStartRound(b.getAttribute('data-type')).catch(e=>showDebug('Button error: '+(e&&e.message||e)));
    });
  }
  if(isHost){
    document.getElementById('endBtn').onclick = ()=> hostEndGame();
    root.querySelectorAll('[data-remove]').forEach(b=>{
      b.onclick = ()=> hostRemovePlayer(b.getAttribute('data-remove')).catch(e=>showDebug('Remove failed: '+(e&&e.message||e)));
    });
    root.querySelectorAll('[data-makehost]').forEach(b=>{
      b.onclick = ()=> hostTransferHost(b.getAttribute('data-makehost')).catch(e=>showDebug('Make Host failed: '+(e&&e.message||e)));
    });
  }
}

async function hostTransferHost(name){
  if(!confirm(`Make ${name} the new host? You'll become a regular player.`)) return;
  const st = await sGet(stateKey(CODE));
  if(!st){ showDebug('Could not load game state (connection or rules issue) — try again.'); return; }
  ensureArrays(st);
  st.hostName = name;
  st.updatedAt = Date.now();
  const ok = await sSet(stateKey(CODE), st);
  if(!ok){ showDebug('Could not change host — check Realtime Database write permissions.'); return; }
  IS_HOST = (st.hostName === ME);
  render(st);
}

async function hostRemovePlayer(name){
  if(!confirm(`Remove ${name} from the game?`)) return;
  const st = await sGet(stateKey(CODE));
  if(!st){ showDebug('Could not load game state (connection or rules issue) — try again.'); return; }
  ensureArrays(st);
  st.players = st.players.filter(p=>p!==name);
  delete st.totalScores[name];
  st.updatedAt = Date.now();
  const ok = await sSet(stateKey(CODE), st);
  if(!ok){ showDebug('Could not remove player — check Realtime Database write permissions.'); return; }
  await sDelete(joinKey(CODE, name));
  render(st);
}

function timerHtml(round){
  if(!round.startedAt || !round.durationMs) return '';
  const elapsed = Date.now()-round.startedAt;
  const remain = Math.max(0, Math.ceil((round.durationMs-elapsed)/1000));
  const pct = Math.max(0,Math.min(1,(round.durationMs-elapsed)/round.durationMs));
  const circ = 2*Math.PI*36;
  return `
    <div class="timer-ring">
      <svg width="90" height="90">
        <circle cx="45" cy="45" r="36" stroke="rgba(255,255,255,0.1)" stroke-width="7" fill="none"/>
        <circle id="timerRingCircle" cx="45" cy="45" r="36" stroke="var(--gold)" stroke-width="7" fill="none"
          stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct)}" stroke-linecap="round"
          transform="rotate(-90 45 45)"/>
      </svg>
      <div class="timer-num" id="timerNumText">${remain}s</div>
    </div>`;
}

function renderRound(st){
  const round = st.round;
  const type = round.type;
  root.innerHTML = `<div class="brand"><div class="mark">ROUND ${st.roundNum}</div><h1>${roundTitle(type)}</h1></div><div id="roundBody"></div>`;
  const body = document.getElementById('roundBody');

  if(type==='trivia') renderTrivia(st, body);
  else if(type==='bluff') renderBluff(st, body);
  else if(type==='prefix') renderGenericSubmit(st, body, {
    label:`Words starting with`, promptHtml:`<span class="blank">${round.prefix}</span>___`,
    placeholder:"e.g. prepare, prevent, precook...", instructions:"List as many real words as you can that start with this prefix. One per line or comma-separated."
  });
  else if(type==='boggle') renderBoggle(st, body);
  else if(type==='wordbank') renderGenericSubmit(st, body, {
    label:`Make words from the letters in`, promptHtml:`${round.baseWord}`,
    placeholder:"e.g. cat, ten, rate...", instructions:"Only use letters that appear in the word above, and no more times than they appear."
  });
  else if(type==='clue') renderClue(st, body);
  else if(type==='blackjack') renderBlackjack(st, body);
  else if(type==='war') renderWar(st, body);
  else if(type==='emoji') renderTrivia(st, body);
  else if(type==='hilo') renderHiLo(st, body);
  else if(type==='wyr') renderWYR(st, body);
}

function roundTitle(type){
  return {trivia:'Trivia Sprint', bluff:'Bluff Trivia', prefix:'Prefix Blitz', boggle:'Boggle', wordbank:'Most Words', clue:'Clue Chain', blackjack:'21 Blackjack', war:'I Declare War', emoji:'Emoji Guess', hilo:'Higher or Lower', wyr:'Would You Rather'}[type] || type;
}

/* ---- 21 Blackjack ---- */
async function renderBlackjack(st, body){
  const round = st.round;
  if(round.phase==='reveal'){
    const results = round.results||{};
    const outcomeLabel = {win:'Won', lose:'Lost', push:'Push', bust:'Bust', blackjack:'Blackjack!'};
    body.innerHTML = `
      <div class="card">
        <div class="tag">Dealer's final hand</div>
        <div class="card-row">${(round.dealerFinalHand||[]).map(cardHtml).join('')}</div>

        <div class="tag" style="margin-top:10px;">Results</div>
        <ul class="players-list">
          ${Object.keys(results).map(name=>{
            const r = results[name];
            return `<li><span>${name} (${r.value}) — ${outcomeLabel[r.outcome]}</span><span class="score">+${r.points}</span></li>`;
          }).join('') || '<li>No hands played.</li>'}
        </ul>
      </div>
      ${IS_HOST ? `<button class="btn-primary" id="nextBtn">Back to Lobby</button>` : `<div class="card center muted">Waiting for host…</div>`}
    `;
    if(IS_HOST) document.getElementById('nextBtn').onclick = hostBackToLobby;
    return;
  }
  const key = submitKey(CODE, st.roundNum, ME);
  let mine = await sGet(key);
  if(!mine){
    const deck = makeShuffledDeck();
    const hand = [deck.pop(), deck.pop()];
    mine = {hand, deck, standing:false};
    await sSet(key, mine);
  }
  const myValue = blackjackHandValue(mine.hand);
  if(body !== document.getElementById('roundBody')) return; // a newer render already replaced this screen
  body.innerHTML = `
    <div class="card">
      ${timerHtml(round)}
      <div class="tag">Dealer shows</div>
      <div class="card-row">${cardHtml(round.dealerHand[0])}<div class="playing-card hidden">?</div></div>
      <div class="muted" id="submitCountText" style="font-size:13px;margin:8px 0;text-align:left;">…</div>
      <div class="tag" style="margin-top:10px;">Your hand</div>
      <div class="card-row">${mine.hand.map(cardHtml).join('')}</div>
      <div class="hand-value">${myValue}${myValue>21?' — BUST':''}</div>
      ${mine.standing ? `<div class="muted center">You're standing at ${myValue}. Waiting on everyone else…</div>` : `
        <div class="row">
          <button class="btn-primary" id="hitBtn" ${myValue>=21?'disabled':''}>Hit</button>
          <button class="btn-secondary" id="standBtn">Stand</button>
        </div>`}
    </div>
    ${IS_HOST ? hostControlBar(['reveal']) : ''}
  `;
  if(!mine.standing){
    document.getElementById('hitBtn').onclick = async ()=>{
      const fresh = await sGet(key);
      if(!fresh || fresh.standing) return;
      const card = fresh.deck.pop();
      fresh.hand.push(card);
      const val = blackjackHandValue(fresh.hand);
      if(val>=21) fresh.standing = true;
      await sSet(key, fresh);
      render(lastState);
    };
    document.getElementById('standBtn').onclick = async ()=>{
      const fresh = await sGet(key);
      if(!fresh) return;
      fresh.standing = true;
      await sSet(key, fresh);
      render(lastState);
    };
  }
  wireHostControls(st);
}

/* ---- I Declare War ---- */
async function warResolveFlipIfReady(st, force){
  const round = st.round;
  const flipKeys = await sList(`vault:${st.code}:warflip:${st.roundNum}:${round.flip}:`);
  if(flipKeys.length < st.players.length && !force) return false;
  let flips = {};
  for(const k of flipKeys){
    const name = k.split(':').slice(5).join(':');
    const v = await sGet(k);
    if(v) flips[name]=v.card;
  }
  if(Object.keys(flips).length===0){
    if(round.flip >= round.totalFlips){
      round.phase='reveal';
      for(const name in round.flipWins) st.totalScores[name]=(st.totalScores[name]||0)+round.flipWins[name];
    } else { round.flip += 1; }
    return true;
  }
  let maxStrength = -1;
  for(const name in flips) maxStrength = Math.max(maxStrength, warCardStrength(flips[name]));
  let winners = Object.keys(flips).filter(name=>warCardStrength(flips[name])===maxStrength);
  if(winners.length>1){
    let warFlips = {};
    for(const name of winners){
      const deckObj = await sGet(submitKey(st.code, st.roundNum, name));
      if(deckObj && deckObj.deck && deckObj.deck.length>0){
        const card = deckObj.deck.pop();
        await sSet(submitKey(st.code, st.roundNum, name), deckObj);
        warFlips[name]=card;
      }
    }
    let maxWar = -1;
    for(const name in warFlips) maxWar = Math.max(maxWar, warCardStrength(warFlips[name]));
    const warWinners = Object.keys(warFlips).filter(name=>warCardStrength(warFlips[name])===maxWar);
    if(warWinners.length===1){
      round.flipWins[warWinners[0]] = (round.flipWins[warWinners[0]]||0)+2;
    } else {
      warWinners.forEach(name=> round.flipWins[name]=(round.flipWins[name]||0)+1);
    }
    round.lastFlipResult = {flips, warFlips, flip: round.flip, wasWar:true};
  } else {
    round.flipWins[winners[0]] = (round.flipWins[winners[0]]||0)+1;
    round.lastFlipResult = {flips, flip: round.flip, wasWar:false};
  }
  if(round.flip >= round.totalFlips){
    round.phase = 'reveal';
    for(const name in round.flipWins) st.totalScores[name]=(st.totalScores[name]||0)+round.flipWins[name];
  } else {
    round.flip += 1;
  }
  return true;
}

async function renderWar(st, body){
  const round = st.round;
  if(round.phase==='reveal'){
    const fw = round.flipWins||{};
    const sorted = Object.keys(fw).sort((a,b)=>(fw[b]||0)-(fw[a]||0));
    body.innerHTML = `
      <div class="card">
        <div class="tag">Final Flip Tally</div>
        <ul class="players-list">
          ${sorted.map(name=>`<li><span>${name}</span><span class="score">${fw[name]||0} flip${fw[name]===1?'':'s'} won</span></li>`).join('') || '<li>No flips played.</li>'}
        </ul>
      </div>
      ${IS_HOST ? `<button class="btn-primary" id="nextBtn">Back to Lobby</button>` : `<div class="card center muted">Waiting for host…</div>`}
    `;
    if(IS_HOST) document.getElementById('nextBtn').onclick = hostBackToLobby;
    return;
  }
  const key = submitKey(CODE, st.roundNum, ME);
  let mine = await sGet(key);
  if(!mine){
    mine = {deck: makeShuffledDeck()};
    await sSet(key, mine);
  }
  const myFlipKey = warFlipKey(CODE, st.roundNum, round.flip, ME);
  const myFlip = await sGet(myFlipKey);
  const last = round.lastFlipResult;
  const fw = round.flipWins||{};
  if(body !== document.getElementById('roundBody')) return; // a newer render already replaced this screen
  body.innerHTML = `
    <div class="card">
      ${timerHtml(round)}
      <div class="tag">Flip ${round.flip} of ${round.totalFlips}</div>
      ${last && last.flip===round.flip-1 ? `
        <div class="muted" style="margin-bottom:10px;font-size:13px;">Last flip: ${Object.keys(last.flips).map(n=>`${n} ${last.flips[n]}`).join(' · ')}${last.wasWar?' — tied! WAR broke it.':''}</div>
      ` : ''}
      ${myFlip ? `
        <div class="tag">Your flip</div>
        <div class="card-row">${cardHtml(myFlip.card)}</div>
        <div class="muted center">Waiting on everyone else to flip…</div>
      ` : `
        <button class="btn-primary" id="flipBtn">Flip Card</button>
      `}
      <div class="divider"></div>
      <div class="tag">Flip wins so far</div>
      <ul class="players-list">${(st.players||[]).map(p=>`<li><span>${p}</span><span class="score">${fw[p]||0}</span></li>`).join('')}</ul>
    </div>
    ${IS_HOST ? `<button class="btn-secondary" id="forceSkipFlip">Skip This Flip (someone stuck?)</button>` : ''}
  `;
  if(!myFlip){
    document.getElementById('flipBtn').onclick = async ()=>{
      const fresh = await sGet(key);
      if(!fresh || !fresh.deck || fresh.deck.length===0) return;
      const card = fresh.deck.pop();
      await sSet(key, fresh);
      await sSet(myFlipKey, {card, ts:Date.now()});
      render(lastState);
    };
  }
  if(IS_HOST){
    document.getElementById('forceSkipFlip').onclick = async ()=>{
      const s = await sGet(stateKey(CODE));
      if(!s){ showDebug('Could not load game state — try again.'); return; }
      ensureArrays(s);
      await warResolveFlipIfReady(s, true);
      await sSet(stateKey(CODE), s);
      render(s);
    };
  }
}

/* ---- Higher or Lower ---- */
async function renderHiLo(st, body){
  const round = st.round;
  if(round.phase==='reveal'){
    const results = round.results||{};
    body.innerHTML = `
      <div class="card">
        <div class="tag">Final Streaks</div>
        <ul class="players-list">
          ${Object.keys(results).map(name=>{
            const r = results[name];
            const label = r.outcome==='busted' ? `Busted at streak ${r.streak}` : `Cashed out at streak ${r.streak}`;
            return `<li><span>${name} — ${label}</span><span class="score">+${r.points}</span></li>`;
          }).join('') || '<li>No one played.</li>'}
        </ul>
      </div>
      ${IS_HOST ? `<button class="btn-primary" id="nextBtn">Back to Lobby</button>` : `<div class="card center muted">Waiting for host…</div>`}
    `;
    if(IS_HOST) document.getElementById('nextBtn').onclick = hostBackToLobby;
    return;
  }
  const key = submitKey(CODE, st.roundNum, ME);
  let mine = await sGet(key);
  if(!mine){
    const deck = makeShuffledDeck();
    const currentCard = deck.pop();
    mine = {deck, currentCard, streak:0, outcome:'active'};
    await sSet(key, mine);
  }
  if(mine.outcome!=='active'){
    if(body !== document.getElementById('roundBody')) return; // a newer render already replaced this screen
    body.innerHTML = `
      <div class="card">
        <div class="tag">Your final card</div>
        <div class="card-row">${cardHtml(mine.currentCard)}</div>
        <div class="hand-value">Streak: ${mine.streak}</div>
        <div class="muted center">${mine.outcome==='busted' ? "Busted — that streak scores 0." : "Cashed out — locked in!"} Waiting on everyone else…</div>
      </div>
      ${IS_HOST ? hostControlBar(['reveal']) : ''}
    `;
    wireHostControls(st);
    return;
  }
  if(body !== document.getElementById('roundBody')) return; // a newer render already replaced this screen
  body.innerHTML = `
    <div class="card">
      ${timerHtml(round)}
      <div class="tag">Current card</div>
      <div class="card-row">${cardHtml(mine.currentCard)}</div>
      <div class="hand-value">Current streak: ${mine.streak}${mine.streak>0?` (worth +${mine.streak} if you cash out now)`:''}</div>
      <div class="muted" id="submitCountText" style="font-size:13px;margin-bottom:10px;text-align:left;">…</div>
      <div class="muted" style="font-size:13px;margin-bottom:10px;text-align:center;">Will the next card be higher or lower? Guess wrong and you lose the whole streak — cash out anytime to bank it.</div>
      <div class="row">
        <button class="btn-secondary" id="lowerBtn">⬇️ Lower</button>
        <button class="btn-secondary" id="higherBtn">⬆️ Higher</button>
      </div>
      ${mine.streak>0 ? `<button class="btn-primary" id="cashOutBtn">💰 Cash Out (+${mine.streak})</button>` : ''}
    </div>
    ${IS_HOST ? hostControlBar(['reveal']) : ''}
  `;
  async function guess(direction){
    const fresh = await sGet(key);
    if(!fresh || fresh.outcome!=='active' || !fresh.deck || fresh.deck.length===0) return;
    const next = fresh.deck.pop();
    const curStrength = warCardStrength(fresh.currentCard);
    const nextStrength = warCardStrength(next);
    if(nextStrength===curStrength){
      fresh.currentCard = next; // push — no change, just continue
    } else {
      const wasHigher = nextStrength>curStrength;
      if((direction==='higher')===wasHigher){
        fresh.streak += 1;
        fresh.currentCard = next;
      } else {
        fresh.currentCard = next;
        fresh.outcome = 'busted';
      }
    }
    await sSet(key, fresh);
    render(lastState);
  }
  document.getElementById('higherBtn').onclick = ()=>guess('higher');
  document.getElementById('lowerBtn').onclick = ()=>guess('lower');
  const cashBtn = document.getElementById('cashOutBtn');
  if(cashBtn){
    cashBtn.onclick = async ()=>{
      const fresh = await sGet(key);
      if(!fresh || fresh.outcome!=='active') return;
      fresh.outcome = 'cashedOut';
      await sSet(key, fresh);
      render(lastState);
    };
  }
  wireHostControls(st);
}

/* ---- Would You Rather ---- */
async function renderWYR(st, body){
  const round = st.round;
  if(round.phase==='vote'){
    const myKey = voteKey(CODE, st.roundNum, ME);
    const myVote = await sGet(myKey);
    if(body !== document.getElementById('roundBody')) return; // a newer render already replaced this screen
    body.innerHTML = `
      <div class="card">
        ${timerHtml(round)}
        <div class="muted" id="submitCountText" style="font-size:13px;margin-bottom:10px;text-align:left;">…</div>
        <div class="submission-item ${myVote && myVote.choice==='A' ? 'selected':''}" data-choice="A" style="cursor:pointer;">
          <b>A:</b> ${escapeHtml(round.optionA)}
        </div>
        <div class="submission-item ${myVote && myVote.choice==='B' ? 'selected':''}" data-choice="B" style="cursor:pointer;">
          <b>B:</b> ${escapeHtml(round.optionB)}
        </div>
        ${myVote ? `<div class="muted center" style="margin-top:10px;">Vote locked in ✓ — change your mind anytime before reveal.</div>` : ''}
      </div>
      ${IS_HOST ? hostControlBar(['reveal']) : ''}
    `;
    body.querySelectorAll('[data-choice]').forEach(el=>{
      el.onclick = async ()=>{
        await sSet(myKey, {choice: el.getAttribute('data-choice'), ts: Date.now()});
        render(lastState);
      };
    });
    wireHostControls(st);
  } else if(round.phase==='reveal'){
    const votes = round.voteBreakdown || {A:0,B:0};
    const results = round.results || {};
    body.innerHTML = `
      <div class="card">
        <div class="tag">The vote</div>
        <div class="muted" style="margin-bottom:10px;">A: ${escapeHtml(round.optionA)} — ${votes.A} vote${votes.A===1?'':'s'}<br>B: ${escapeHtml(round.optionB)} — ${votes.B} vote${votes.B===1?'':'s'}</div>
        <div class="tag">Results</div>
        <ul class="players-list">
          ${Object.keys(results).map(name=>`<li><span>${name} (picked ${results[name].choice})${results[name].blackSheep?' 🐑 lone dissenter!':''}</span><span class="score">+${results[name].points}</span></li>`).join('') || '<li>No votes cast.</li>'}
        </ul>
      </div>
      ${IS_HOST ? `<button class="btn-primary" id="nextBtn">Back to Lobby</button>` : `<div class="card center muted">Waiting for host…</div>`}
    `;
    if(IS_HOST) document.getElementById('nextBtn').onclick = hostBackToLobby;
  }
}

/* ---- Host controls (submit->vote/reveal transitions) ---- */
function hostControlBar(nextOptions){
  return `<div class="card">
    <div class="tag">Host controls</div>
    ${nextOptions.includes('vote') ? `<button class="btn-secondary" id="hostAdvance">Everyone's In — Move to Voting</button>` : ''}
    ${nextOptions.includes('reveal') ? `<button class="btn-secondary" id="hostAdvance">Everyone's In — Reveal Results</button>` : ''}
  </div>`;
}
function wireHostControls(st){
  const btn = document.getElementById('hostAdvance');
  if(!btn) return;
  btn.onclick = async ()=>{
    const round = st.round;
    if(round.phase==='submit' && round.type==='bluff'){
      await hostAdvancePhase('vote');
    } else {
      const isWordRound = LIST_ROUND_TYPES.includes(round.type);
      if(isWordRound){ btn.textContent='Checking spelling…'; btn.disabled=true; }
      try{
        await hostTallyAndReveal();
      } finally {
        if(isWordRound){ btn.textContent='Everyone\'s In — Reveal Results'; btn.disabled=false; }
      }
    }
  };
}

/* ---- Scoreboard ---- */
function renderScoreboard(st){
  const sorted = [...st.players].sort((a,b)=>(st.totalScores[b]||0)-(st.totalScores[a]||0));
  root.innerHTML = `
    <div class="brand">
      <div class="mark">GAME OVER</div>
      <h1>Final Scores</h1>
    </div>
    <div class="card scoreboard-podium">
      <div class="place1">🏆 ${sorted[0]||'—'}</div>
      <div class="muted">wins with ${st.totalScores[sorted[0]]||0} points</div>
    </div>
    <div class="card">${scoreListHtml(st)}</div>
    ${IS_HOST ? `<button class="btn-primary" id="newRoundBtn">Play Another Round</button>` : ''}
  `;
  if(IS_HOST){
    document.getElementById('newRoundBtn').onclick = async ()=>{
      const s = await sGet(stateKey(CODE));
      s.phase='lobby'; await sSet(stateKey(CODE), s);
    };
  }
}

function escapeHtml(s){
  const d=document.createElement('div'); d.textContent=s; return d.innerHTML;
}

/* local 1s tick to refresh timer display without waiting for poll */
const LIST_ROUND_TYPES = ['prefix','boggle','wordbank'];
let autoSubmittedForRound = 0;

function updateTimerOnly(){
  if(!lastState || lastState.phase!=='round' || !lastState.round) return;
  const round = lastState.round;
  if(!round.startedAt || !round.durationMs) return;
  const elapsed = Date.now()-round.startedAt;
  const remain = Math.max(0, Math.ceil((round.durationMs-elapsed)/1000));
  const pct = Math.max(0,Math.min(1,(round.durationMs-elapsed)/round.durationMs));
  const circ = 2*Math.PI*36;
  const numEl = document.getElementById('timerNumText');
  const ringEl = document.getElementById('timerRingCircle');
  if(numEl) numEl.textContent = remain+'s';
  if(ringEl) ringEl.setAttribute('stroke-dashoffset', circ*(1-pct));

  // once time is up for list-based rounds, keep everything locked on every tick
  if(remain<=0 && LIST_ROUND_TYPES.includes(round.type) && round.phase==='submit'){
    document.querySelectorAll('.word-box-input').forEach(i=>i.disabled=true);
    const addBtn = document.getElementById('addWordBtn');
    if(addBtn) addBtn.disabled = true;
    const subBtn = document.getElementById('subBtn');
    if(subBtn) subBtn.disabled = true;

    if(autoSubmittedForRound !== lastState.roundNum){
      autoSubmittedForRound = lastState.roundNum;
      const words = gatherWordBoxValues();
      sSet(submitKey(CODE, lastState.roundNum, ME), {text: words.join(','), ts: Date.now()})
        .then(ok=>{
          const savedEl = document.getElementById('savedIndicator');
          if(savedEl){
            savedEl.textContent = ok
              ? `Time's up — your ${words.length} word${words.length===1?'':'s'} ${words.length===1?'was':'were'} submitted automatically.`
              : "Time's up, but auto-submit failed — check your connection.";
            savedEl.style.color = ok ? 'var(--good)' : 'var(--coral)';
          }
        })
        .catch(e=>showDebug('Auto-submit failed: '+(e&&e.message||e)));
    }
  }

  // trivia/bluff: auto-submit whatever's typed (even blank) the instant time runs out,
  // but only if the player hasn't already manually locked in an answer
  if(remain<=0 && (round.type==='trivia' || round.type==='bluff' || round.type==='emoji') && round.phase==='submit'
     && !localSubmitted && autoSubmittedForRound !== lastState.roundNum){
    autoSubmittedForRound = lastState.roundNum;
    const el = document.getElementById('submitInput');
    const val = el ? el.value : '';
    sSet(submitKey(CODE, lastState.roundNum, ME), {text: val, ts: Date.now()})
      .then(()=>{ localSubmitted = true; render(lastState); })
      .catch(e=>showDebug('Auto-submit failed: '+(e&&e.message||e)));
  }

  // blackjack: auto-stand at whatever hand you have when time runs out
  if(remain<=0 && round.type==='blackjack' && round.phase==='submit'
     && autoSubmittedForRound !== lastState.roundNum){
    autoSubmittedForRound = lastState.roundNum;
    (async ()=>{
      const key = submitKey(CODE, lastState.roundNum, ME);
      const mine = await sGet(key);
      if(mine && !mine.standing){
        mine.standing = true;
        await sSet(key, mine);
        render(lastState);
      }
    })();
  }

  // war: auto-flip your next card if you haven't flipped yet when time runs out
  if(remain<=0 && round.type==='war' && round.phase==='submit'
     && autoSubmittedForRound !== lastState.roundNum){
    autoSubmittedForRound = lastState.roundNum;
    (async ()=>{
      const key = submitKey(CODE, lastState.roundNum, ME);
      const myFlipKey = warFlipKey(CODE, lastState.roundNum, round.flip, ME);
      const already = await sGet(myFlipKey);
      if(already) return;
      const fresh = await sGet(key);
      if(fresh && fresh.deck && fresh.deck.length>0){
        const card = fresh.deck.pop();
        await sSet(key, fresh);
        await sSet(myFlipKey, {card, ts:Date.now()});
        render(lastState);
      }
    })();
  }
  // hilo: auto-cash-out at whatever streak you have when time runs out
  if(remain<=0 && round.type==='hilo' && round.phase==='submit'
     && autoSubmittedForRound !== lastState.roundNum){
    autoSubmittedForRound = lastState.roundNum;
    (async ()=>{
      const key = submitKey(CODE, lastState.roundNum, ME);
      const mine = await sGet(key);
      if(mine && mine.outcome==='active'){
        mine.outcome = 'cashedOut';
        await sSet(key, mine);
        render(lastState);
      }
    })();
  }
}
LOCAL_TICK = setInterval(updateTimerOnly, 1000);

async function updateSubmitCounter(){
  if(!lastState || lastState.phase!=='round' || !lastState.round) return;
  const round = lastState.round;
  const el = document.getElementById('submitCountText');
  if(!el) return;
  const total = (lastState.players||[]).length;
  try{
    let count = 0, label = 'answered';
    if(round.phase==='submit' && (round.type==='blackjack' || round.type==='hilo')){
      const keys = await sList(`vault:${CODE}:submit:${lastState.roundNum}:`);
      let done = 0;
      for(const k of keys){
        const v = await sGet(k);
        if(!v) continue;
        if(round.type==='blackjack' && v.standing) done++;
        if(round.type==='hilo' && v.outcome && v.outcome!=='active') done++;
      }
      count = done;
      label = round.type==='blackjack' ? 'standing' : 'cashed out or busted';
    } else if(round.phase==='submit'){
      const keys = await sList(`vault:${CODE}:submit:${lastState.roundNum}:`);
      count = keys.length;
      label = (round.type==='bluff') ? 'submitted' : 'answered';
    } else if(round.phase==='vote' && (round.type==='bluff' || round.type==='wyr')){
      const keys = await sList(`vault:${CODE}:vote:${lastState.roundNum}:`);
      count = keys.length;
      label = 'voted';
    } else {
      return;
    }
    el.textContent = `${count} of ${total} ${label}`;
    if(count>=total && total>0){
      el.style.color = 'var(--good)';
      el.style.fontWeight = '700';
    } else {
      el.style.color = '';
      el.style.fontWeight = '';
    }
  }catch(e){ /* non-critical, ignore */ }
}
setInterval(updateSubmitCounter, 2200);

renderJoinScreen();
</script>
